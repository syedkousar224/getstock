<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Getstock</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ============ HEADER (same as home) ============ -->
  <header class="site-header">
    <div class="header-left">
      <button id="menuToggle" class="icon-btn" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <a href="/index.html" class="logo">
        <span class="logo-mark">G</span>
        <span class="logo-word">Getstock</span>
      </a>
    </div>

    <form id="searchForm" class="header-search">
      <input type="text" id="searchInput" placeholder="Search Getstock" autocomplete="off" />
      <button type="submit" class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
      </button>
    </form>

    <div class="header-right">
      <a href="/upload.html" class="icon-btn upload-btn" aria-label="Upload" title="Upload">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 13h-4v-4H8l4-4 4 4h-2zM4 19h16v-2H4z"/></svg>
        <span class="upload-label">Upload</span>
      </a>
      <div id="authArea" class="auth-area"></div>
    </div>
  </header>

  <!-- ============ SIDEBAR (same as home) ============ -->
  <aside id="sidebar" class="sidebar">
    <nav class="sidebar-nav">
      <a href="/index.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
        <span>Home</span>
      </a>
      <a href="/index.html?kind=video" class="sidebar-link">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>
        <span>Videos</span>
      </a>
      <a href="/index.html?kind=image" class="sidebar-link">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m0 2v14h14V5zm2.5 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3M6 17l4-5 2.5 3L15 12l3 5z"/></svg>
        <span>Images</span>
      </a>
      <div class="sidebar-divider"></div>
      <a href="/upload.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M14 13h-4v-4H8l4-4 4 4h-2zM4 19h16v-2H4z"/></svg>
        <span>Upload</span>
      </a>
    </nav>
  </aside>

  <!-- ============ WATCH LAYOUT ============ -->
  <main id="mainContent" class="main-content watch-page">
    <div class="watch-grid">

      <!-- primary column: player + info + comments -->
      <div class="watch-primary">
        <div id="playerWrap" class="player-wrap">
          <!-- image or video element injected by JS -->
        </div>

        <h1 id="mediaTitle" class="watch-title">Loading…</h1>

        <div class="watch-meta-row">
          <div class="channel-block">
            <div class="avatar avatar-md" id="ownerAvatar"></div>
            <div class="channel-info">
              <span id="ownerName" class="channel-name"></span>
              <span id="mediaStats" class="channel-sub muted"></span>
            </div>
          </div>

          <div class="watch-actions">
            <button id="likeBtn" class="pill-btn">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 21h4V9H2zm19.83-11.5c.11-.25.17-.52.17-.8v-1a2 2 0 0 0-2-2h-5.5l.85-4.1V1.5C15.15.68 14.48 0 13.65 0h-.15L8 5.5V21h11l3.16-7.34c.1-.24.17-.51.17-.79z"/></svg>
              <span id="likeCount">0</span>
            </button>
            <a id="downloadBtn" class="pill-btn" href="#" download>
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 20h14v-2H5zM13 4h-2v9H8l4 4 4-4h-3z"/></svg>
              Download
            </a>
          </div>
        </div>

        <p id="mediaDescription" class="watch-description"></p>

        <section class="comments-section">
          <h2 class="comments-heading"><span id="commentCount">0</span> Comments</h2>

          <form id="commentForm" class="comment-form" hidden>
            <div class="avatar avatar-sm" id="commentAvatar"></div>
            <input type="text" id="commentInput" placeholder="Add a comment…" maxlength="1000" autocomplete="off" />
            <button type="submit" class="btn btn-primary btn-sm">Post</button>
          </form>
          <p id="commentSignInPrompt" class="muted comment-signin-prompt" hidden>
            <a href="/login.html">Sign in</a> to leave a comment.
          </p>

          <ul id="commentList" class="comment-list"></ul>
        </section>
      </div>

      <!-- secondary column: related items -->
      <aside class="watch-secondary">
        <h2 class="related-heading">More like this</h2>
        <ul id="relatedList" class="related-list"></ul>
      </aside>
    </div>
  </main>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <script src="/js/app.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
