<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — Getstock</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <a href="/index.html" class="logo auth-logo">
      <span class="logo-mark">G</span>
      <span class="logo-word">Getstock</span>
    </a>
    <h1 class="auth-title">Join Getstock</h1>
    <p class="auth-sub">Pick a username and password to get started.</p>

    <form id="registerForm" class="auth-form" novalidate>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required minlength="3" />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="6" />
        <small>At least 6 characters.</small>
      </label>
      <p class="form-error" id="formError" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
    <p class="auth-switch"><a href="/index.html">Continue browsing without an account →</a></p>
  </main>
  <script src="/js/app.js"></script>
  <script>Getstock.initRegisterPage();</script>
</body>
</html>
